name: Install formulas
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew tap onurkat/scrub "$GITHUB_WORKSPACE"
      - run: brew install --build-from-source onurkat/scrub/scrub onurkat/scrub/scrub-desktop
      - run: brew test onurkat/scrub/scrub
      - run: |
          printf 'previous-clipboard' | pbcopy
          scrub-desktop --self-test
          test "$(pbpaste)" = previous-clipboard
          if xattr -p com.apple.quarantine "$(brew --prefix scrub-desktop)/Scrub.app"; then exit 1; fi
      - run: brew audit --strict onurkat/scrub/scrub onurkat/scrub/scrub-desktop
